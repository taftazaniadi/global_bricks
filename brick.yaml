name: features
description: Clean Architecture Feature Template with optional sub-feature and GetIt injector.
version: 0.1.0+1

vars:
  default_target:
    type: boolean
    description: Whether to use the default target directory path
    default: true
    prompt: "Use default target path? (yes/no) : "

  custom_target_path:
    type: string
    description: Custom target directory path for the feature (relative to project root)
    default: "lib/features"
    prompt: "Custom target directory path : "

  feature_name:
    type: string
    description: Feature name (e.g. auth, profile, etc.)
    default: ""
    prompt: "Feature name (e.g., auth or checkout/payment) : "

  has_subfeatures:
    type: boolean
    description: Whether the feature should include subfeatures
    default: false
    prompt: "Add subfeatures? (yes/no) : "

  subfeature_name:
    type: string
    description: Comma-separated list of subfeatures (used when the answer above is yes)
    default: ""
    prompt: "Subfeatures (comma-separated, optional) : "
